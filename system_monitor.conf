# system_monitor.conf
# External configuration for system_monitor.sh

# Email settings
EMAIL_TO=""
EMAIL_FROM=""

# SMTP settings for container email delivery
SMTP_HOST=""
SMTP_PORT=""
SMTP_USER=""
SMTP_PASSWORD=""
SMTP_TLS=on
SMTP_STARTTLS=on
SMTP_TLS_CERTCHECK=off

# Limits
CPU_LIMIT=90
RAM_LIMIT=80
DISK_LIMIT=90
LOAD_LIMIT=4

# Telegram settings
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# Twilio WhatsApp settings (for WhatsApp Business API / Sandbox)
WHATSAPP_TWILIO_ACCOUNT_SID=""
WHATSAPP_TWILIO_AUTH_TOKEN=""
WHATSAPP_TWILIO_FROM="whatsapp:"
WHATSAPP_TWILIO_TO="whatsapp:"
# Optional: use a Twilio WhatsApp template instead of sending a plain text body
WHATSAPP_TWILIO_CONTENT_SID=""

# Optional override for file paths
STATE_FILE="/tmp/monitor_sistema_html.state"
HIST_FILE="/tmp/monitor_sistema_storico.csv"
GRAPH_FILE="/tmp/monitor_sistema_grafico.png"
TOP_PROCESSES_LOG="/tmp/top_processes.log"
